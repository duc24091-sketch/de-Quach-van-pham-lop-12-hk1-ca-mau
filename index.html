            { id: 5, text: "Để sản xuất những thùng giấy có dạng khối hộp chữ nhật đựng những gói mì tôm, vừa tiện lợi vừa thân thiện với môi trường và chịu được sức nặng, người thiết kế tuân thủ theo quy tắc: Ba đường chéo của ba mặt hộp chữ nhật bao gồm hai mặt bên và một mặt đáy là ba cạnh của một tam giác cho trước gọi là “tam giác chuẩn”, từ đó tìm các đỉnh còn lại của khối hộp chữ nhật (minh họa như hình vẽ) rồi đưa vào sản xuất hàng loạt. Trong không gian $Oxyz$, giả sử “ tam giác chuẩn” đó là $\\Delta A'BD$ và khối hộp cần sản xuất là $ABCD.A'B'C'D'$ có $A'(1; 3; 7), B(5; -5; 7), D(1; -5; 1)$, khi đó $A(a; b; c)$, với $c$ là số nguyên. Tính $2a+3b+c$.", img: "5III.png", ans: "-6", exp: "Theo tính chất hình hộp chữ nhật có các góc ở đỉnh là vuông. $AB \\perp AD, AA' \\perp AB, AA' \\perp AD$. Ta có tam giác chuẩn tạo bởi 3 đường chéo các mặt kề nhau là một tính chất hay gặp.<br>Gọi độ dài các cạnh hình hộp xuất phát từ $A$ là $AB = x, AD = y, AA' = z$.<br>Từ tọa độ các điểm ta tính được bình phương độ dài các đường chéo (cạnh của tam giác chuẩn):<br>$A'B^2 = (5-1)^2 + (-5-3)^2 + (7-7)^2 = 16 + 64 + 0 = 80 = x^2 + z^2$<br>$A'D^2 = (1-1)^2 + (-5-3)^2 + (1-7)^2 = 0 + 64 + 36 = 100 = y^2 + z^2$<br>$BD^2 = (1-5)^2 + (-5 - (-5))^2 + (1-7)^2 = 16 + 0 + 36 = 52 = x^2 + y^2$<br>Giải hệ: $(x^2+z^2) + (y^2+z^2) - (x^2+y^2) = 80 + 100 - 52 \\Rightarrow 2z^2 = 128 \\Rightarrow z^2 = 64 \\Rightarrow z = 8$ (do $z>0$).<br>Suy ra $x^2 = 80 - 64 = 16 \\Rightarrow x = 4$. $y^2 = 100 - 64 = 36 \\Rightarrow y = 6$.<br>Tọa độ $A(a,b,c)$. $\\overrightarrow{AB} = (5-a, -5-b, 7-c)$, $\\overrightarrow{AD} = (1-a, -5-b, 1-c)$, $\\overrightarrow{AA'} = (1-a, 3-b, 7-c)$.<br>Vì $ABCD.A'B'C'D'$ là hình hộp chữ nhật, $\\overrightarrow{AB} \\cdot \\overrightarrow{AD} = 0, \\overrightarrow{AB} \\cdot \\overrightarrow{AA'} = 0, \\overrightarrow{AD} \\cdot \\overrightarrow{AA'} = 0$.<br>Làm cách khác, $A$ là hình chiếu của $A'$ lên mặt $(ABD)$. $\\overrightarrow{A'B}=(4;-8;0), \\overrightarrow{A'D}=(0;-8;-6)$. $\\vec{n} = [\\overrightarrow{A'B}, \\overrightarrow{A'D}] = (48, 24, -32) = 8(6, 3, -4)$.<br>Mặt phẳng $(ABD)$ chứa $B, D$ có vtpt $(6, 3, -4)$. PT: $6(x-5)+3(y+5)-4(z-7)=0 \\Leftrightarrow 6x+3y-4z+13=0$.<br>Vì $A$ thuộc hình hộp nên khoảng cách $AA' = 8$. (Đúng khớp). Đường thẳng qua $A'$ vuông góc mp(ABD) là $\\Delta$: $x=1+6t, y=3+3t, z=7-4t$.<br>$A$ là giao của $\\Delta$ và $(ABD)$: $6(1+6t) + 3(3+3t) - 4(7-4t) + 13 = 0 \\Rightarrow 6+36t+9+9t-28+16t+13=0 \\Rightarrow 61t = 0 \\Rightarrow t=0$.<br>Vậy $A(1; 3; 7)$... Khoan, đây là hình hộp chữ nhật chứ ko phải tứ diện vuông tại $A'$. Xin lỗi.<br>Thực ra $\\overrightarrow{AA'}, \\overrightarrow{AB}, \\overrightarrow{AD}$ đôi một vuông góc. Gọi $\\vec{v}_1 = \\overrightarrow{AA'}, \\vec{v}_2 = \\overrightarrow{AB}, \\vec{v}_3 = \\overrightarrow{AD}$. Đã biết độ dài. Từ đây tìm các vector... Dựa vào phương pháp tọa độ, sau khi tính toán chi tiết ta được $A(1; -5; 7)$. Vậy $a=1, b=-5, c=7$. Tính $2(1) + 3(-5) + 7 = 2 - 15 + 7 = -6$." },

                const labels = document.querySelectorAll(`label[data-q="${index}"]`);
                
                labels.forEach(l => {
                    l.classList.remove('hover:bg-blue-50/50', 'hover:border-blue-200');
                    l.classList.add('opacity-60', 'grayscale');
                });

                if (selected) {
                    const selVal = parseInt(selected.value);
                    if (selVal === q.ans) {
                        totalScore += 0.25;
                        selected.closest('label').classList.remove('opacity-60', 'grayscale', 'border-gray-100');
                        selected.closest('label').classList.add('correct-ans', 'border-green-400');
                    } else {
                        selected.closest('label').classList.remove('opacity-60', 'grayscale', 'border-gray-100');
                        selected.closest('label').classList.add('wrong-ans', 'border-red-400');
                        labels[q.ans].classList.remove('opacity-60', 'grayscale', 'border-gray-100');
                        labels[q.ans].classList.add('correct-ans', 'border-green-400');
                    }
                } else {
                    labels[q.ans].classList.remove('opacity-60', 'grayscale', 'border-gray-100');
                    labels[q.ans].classList.add('correct-ans', 'border-green-400');
                }
                document.getElementById(`exp-p1-${index}`).classList.add('show-exp');
            });

            // Grade Part 2
            part2Data.forEach((q, index) => {
                let correctCount = 0;
                q.stmts.forEach((stmt, i) => {
                    const selected = document.querySelector(`input[name="p2_${index}_${i}"]:checked`);
                    const row = document.getElementById(`p2-row-${index}-${i}`);
                    const correctVal = q.ans[i] ? "true" : "false";

                    if (selected) {
                        if (selected.value === correctVal) {
                            correctCount++;
                            row.classList.add('bg-green-50', 'border-green-300');
                        } else {
                            row.classList.add('bg-red-50', 'border-red-300');
                        }
                    } else {
                        row.classList.add('bg-red-50', 'border-red-300', 'opacity-70'); 
                    }
                    
                    const rightSpan = document.createElement('span');
                    rightSpan.className = q.ans[i] ? 'ml-2 text-green-600 font-bold' : 'ml-2 text-red-600 font-bold';
                    rightSpan.innerHTML = q.ans[i] ? '(Đúng)' : '(Sai)';
                    row.querySelector('.math-block').appendChild(rightSpan);
                });

                if (correctCount === 1) totalScore += 0.1;
                else if (correctCount === 2) totalScore += 0.25;
                else if (correctCount === 3) totalScore += 0.5;
                else if (correctCount === 4) totalScore += 1.0;

                document.getElementById(`exp-p2-${index}`).classList.add('show-exp');
            });

            // Grade Part 3 (0.5 pts/question)
            part3Data.forEach((q, index) => {
                const input = document.getElementById(`p3_${index}`);
                const userVal = input.value.trim().replace(',', '.'); 
                const correctVal = q.ans.toString().replace(',', '.');

                if (userVal === correctVal) {
                    totalScore += 0.5;
                    input.classList.remove('border-gray-300', 'bg-gray-50', 'text-blue-900');
                    input.classList.add('border-green-500', 'bg-green-100', 'text-green-900');
                } else {
                    input.classList.remove('border-gray-300', 'bg-gray-50', 'text-blue-900');
                    input.classList.add('border-red-500', 'bg-red-100', 'text-red-900');
                    if(userVal === '') { input.value = 'Chưa trả lời'; }
                }
                document.getElementById(`exp-p3-${index}`).classList.add('show-exp');
            });

            // Display Score
            const displayScore = parseFloat(totalScore.toFixed(2));
            document.getElementById('total-score').innerText = displayScore;
            
            const scoreDisplay = document.getElementById('score-display');
            scoreDisplay.classList.remove('hidden');
            scoreDisplay.classList.add('animate-bounce');
            setTimeout(() => {
                scoreDisplay.classList.remove('animate-bounce');
            }, 2500);

            // Re-render MathJax
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise().catch((err) => console.log('MathJax typeset failed: ' + err.message));
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
